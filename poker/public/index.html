<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1410" />
  <title>德州扑克 · 牌桌</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部栏 -->
  <header id="topbar" class="hidden">
    <div class="brand"><span class="brand-mark">A♠</span><span class="brand-name">德州扑克</span></div>
    <button id="topbar-code" class="topbar-code" title="点击复制邀请链接">房间码 ------</button>
    <div id="topbar-status" class="topbar-status"></div>
    <button id="btn-terminate" class="btn btn-ghost btn-terminate hidden">终止牌局</button>
    <button id="btn-leave" class="btn btn-ghost">离开牌桌</button>
  </header>

  <!-- 入口页 -->
  <section id="screen-entry" class="screen">
    <div class="entry-card">
      <div class="entry-logo">A<span class="suit-red">♥</span></div>
      <h1 class="entry-title">德州扑克</h1>
      <p class="entry-sub">创建房间，邀请好友 2~10 人同桌对战</p>

      <div class="field">
        <label>你的昵称</label>
        <input id="inp-nickname" maxlength="12" placeholder="输入昵称" />
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="create">创建房间</button>
        <button class="tab" data-tab="join">加入房间</button>
      </div>

      <div id="pane-create" class="pane">
        <div class="field-row">
          <div class="field">
            <label>初始筹码</label>
            <input id="inp-chips" type="number" value="1000" min="10" step="100" />
          </div>
          <div class="field">
            <label>小盲 / 大盲</label>
            <div class="blind-inputs">
              <input id="inp-sb" type="number" value="5" min="1" />
              <span>/</span>
              <input id="inp-bb" type="number" value="10" min="2" />
            </div>
          </div>
        </div>
        <button id="btn-create" class="btn btn-primary btn-block">创建房间</button>
      </div>

      <div id="pane-join" class="pane hidden">
        <div class="field">
          <label>房间码</label>
          <input id="inp-code" maxlength="6" placeholder="6 位房间码" class="code-input" />
        </div>
        <button id="btn-join" class="btn btn-primary btn-block">加入房间</button>
      </div>
    </div>
  </section>

  <!-- 大厅页 -->
  <section id="screen-lobby" class="screen hidden">
    <div class="lobby">
      <div class="lobby-code">
        <div class="lobby-code-label">房间码</div>
        <div id="lobby-code" class="lobby-code-value">------</div>
        <button id="btn-copy" class="btn btn-ghost">复制邀请链接</button>
      </div>

      <div class="lobby-main">
        <div class="panel">
          <div class="panel-head">
            <h2>玩家（<span id="lobby-count">0</span>/10）</h2>
          </div>
          <ul id="lobby-players" class="player-list"></ul>
        </div>

        <div class="panel panel-settings">
          <div class="panel-head"><h2>房间设置</h2></div>
          <div class="field-row">
            <div class="field">
              <label>初始筹码</label>
              <input id="set-chips" type="number" value="1000" min="10" />
            </div>
            <div class="field">
              <label>小盲注</label>
              <input id="set-sb" type="number" value="5" min="1" />
            </div>
            <div class="field">
              <label>大盲注</label>
              <input id="set-bb" type="number" value="10" min="2" />
            </div>
          </div>
          <p id="settings-hint" class="hint hidden">仅房主可在开局前修改设置</p>
        </div>
      </div>

      <div class="lobby-actions">
        <button id="btn-start" class="btn btn-primary btn-lg">开始游戏</button>
      </div>
    </div>
  </section>

  <!-- 牌桌页 -->
  <section id="screen-game" class="screen hidden">
    <div id="table-wrap">
      <div id="table">
        <div id="table-ring">
          <div id="board-area">
            <div id="pot" class="pot"></div>
            <div id="community" class="community"></div>
          </div>
          <div id="seats"></div>
        </div>
      </div>
      <div id="countdown" class="countdown hidden">
        <div class="countdown-label"></div>
        <div class="countdown-bar"><div class="countdown-fill"></div></div>
        <div class="countdown-secs"></div>
      </div>
      <div id="result-banner" class="result-banner hidden"></div>
      <div id="stats-panel" class="stats-panel"></div>
    </div>

    <div id="dock">
      <div class="dock-head">
        <div id="ticker" class="ticker"></div>
        <button id="dock-toggle" class="dock-toggle">收起</button>
      </div>
      <div id="dock-main">
        <div id="my-cards" class="my-cards"></div>
        <div id="action-area" class="action-area">
          <div id="turn-label" class="turn-label"></div>
          <div id="action-buttons" class="action-buttons"></div>
          <div id="raise-panel" class="raise-panel hidden"></div>
        </div>
      </div>
      <div id="street-actions" class="street-actions"></div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box modal-box-sm">
      <div class="modal-title" id="confirm-title">确认</div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirm-cancel">取消</button>
        <button class="btn btn-primary" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
